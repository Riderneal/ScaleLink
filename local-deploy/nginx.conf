events {}

http {
  upstream app_servers {
    server app1:8080;
    server app2:8080;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_servers;
      proxy_set_header Host $host;
      # Append (don't replace) so a caller-supplied X-Forwarded-For (e.g. the
      # k6 load test simulating distinct client IPs) survives as the leftmost
      # entry - Express's trust proxy setting reads that leftmost value as
      # the real client IP.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
